<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>CIF Viewer — static v1</title>
  <script src="https://cdn.plot.ly/plotly-3.0.1.min.js"></script>
  <style>
    :root{--bg:#fff;--panel:#fff;--text:#222;--border:#c8c8c8;--soft:#f5f5f5;--muted:#666}
    *{box-sizing:border-box} html,body{margin:0;height:100%;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text)}
    body.dark{--bg:#17191d;--panel:#1f2228;--text:#e8e8e8;--border:#4a4f58;--soft:#2c3037;--muted:#b8bec8}
    #toolbar{height:54px;display:flex;align-items:center;gap:8px;padding:0 12px;border-bottom:1px solid var(--border);background:var(--panel);position:relative;z-index:5000;overflow:visible;flex-wrap:nowrap}
    .brand{font-weight:700;white-space:nowrap}.version{margin-left:auto;color:var(--muted);font-size:12px;white-space:nowrap}
    select,button{height:32px;border:1px solid var(--border);background:var(--panel);color:var(--text);border-radius:6px;padding:0 10px;cursor:pointer}
    .control{position:relative;overflow:visible;z-index:5001}.popover{display:none;position:absolute;top:38px;left:0;min-width:220px;max-height:420px;overflow:auto;background:var(--panel);border:1px solid var(--border);border-radius:8px;box-shadow:0 8px 28px rgba(0,0,0,.18);padding:8px;z-index:10000}.popover.open{display:block}
    .actions{display:flex;gap:6px;padding-bottom:7px;margin-bottom:6px;border-bottom:1px solid var(--border)}.actions button{height:27px;font-size:11px;background:var(--soft)}
    .check-row{display:flex;align-items:center;gap:7px;padding:4px 3px;font-size:13px;white-space:nowrap}
    #viewerWrap{height:calc(100vh - 54px);position:relative}.plot{width:100%;height:100%}
    #infoPanel{position:absolute;left:24px;top:20px;width:285px;max-height:50vh;overflow:auto;padding:10px 12px;background:color-mix(in srgb,var(--panel) 96%,transparent);border:1px solid var(--border);border-radius:8px;z-index:20;font-size:11px;line-height:1.45;box-shadow:0 5px 18px rgba(0,0,0,.1)}
    #elementLegend{position:absolute;right:18px;bottom:18px;min-width:135px;max-height:280px;overflow:auto;padding:8px 10px;background:color-mix(in srgb,var(--panel) 96%,transparent);border:1px solid var(--border);border-radius:8px;z-index:20;font-size:12px}.legend-title{font-weight:700;margin-bottom:5px}.legend-row{display:flex;align-items:center;gap:7px;padding:3px 0}.dot{width:12px;height:12px;border-radius:50%;border:1px solid #555}
    #projectionPanel{position:absolute;left:24px;bottom:20px;width:250px;height:250px;background:var(--panel);border:1px solid var(--border);border-radius:8px;z-index:20;padding:6px}.hidden{display:none!important}
    #projectionCanvas{width:100%;height:100%}
    .range-pair{padding:8px 0 10px;border-bottom:1px solid var(--border)}.range-pair:last-child{border-bottom:0}.range-title{font-weight:700;font-size:12px}.range-read{display:flex;justify-content:space-between;font-size:11px;margin:4px 0}.range-pair input[type=range]{width:100%}
    #customDrawer{position:fixed;right:-360px;top:54px;width:340px;height:calc(100vh - 54px);background:var(--panel);border-left:1px solid var(--border);box-shadow:-8px 0 24px rgba(0,0,0,.16);z-index:500;transition:right .2s;overflow:auto}#customDrawer.open{right:0}.drawer-head{position:sticky;top:0;display:flex;align-items:center;padding:12px 14px;background:var(--panel);border-bottom:1px solid var(--border);z-index:2}.drawer-head b{flex:1}.drawer-body{padding:12px 14px}.custom-row{display:grid;grid-template-columns:48px 1fr 72px;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid var(--border)}.custom-row input[type=color]{width:38px;height:28px;border:0;background:none}.custom-row input[type=range]{width:100%}.small{font-size:11px;color:var(--muted)}
    #modalBack{display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:1000;align-items:center;justify-content:center}#modalBack.open{display:flex}.modal{width:min(900px,92vw);max-height:82vh;overflow:auto;background:var(--panel);border-radius:10px;box-shadow:0 15px 50px rgba(0,0,0,.3)}.modal-head{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--border)}.modal-head b{flex:1}.modal-body{padding:14px}table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:7px 9px;border-bottom:1px solid var(--border)}th{background:var(--soft);position:sticky;top:0}
    #error{white-space:pre-wrap;display:none;position:absolute;inset:20px auto auto 50%;transform:translateX(-50%);z-index:100;background:#7f1d1d;color:#fff;padding:10px 14px;border-radius:7px;max-width:80vw}
    @media(max-width:800px){#infoPanel{width:240px;max-height:38vh}.version{display:none}}
  
    #viewerWrap{isolation:isolate}
    #toolbar .popover{pointer-events:auto}

  
@media (max-width: 760px) {
  html, body {
    height: 100%;
    overflow: hidden;
  }

  #toolbar {
    height: auto;
    min-height: 54px;
    flex-wrap: wrap;
    align-items: center;
    gap: 6px;
    padding: 8px;
    overflow: visible;
  }

  #toolbar .brand {
    width: 100%;
    font-size: 14px;
  }

  #toolbar select,
  #toolbar button {
    height: 34px;
    font-size: 12px;
    padding: 0 8px;
    max-width: 46vw;
  }

  #toolbar .version {
    margin-left: 0;
    font-size: 10px;
  }

  #viewerWrap {
    height: calc(100dvh - 122px);
    min-height: 360px;
  }

  #infoPanel {
    left: 8px;
    top: 8px;
    width: min(78vw, 280px);
    max-height: 34vh;
    font-size: 10px;
    line-height: 1.35;
    padding: 8px 9px;
  }

  #elementLegend {
    right: 8px;
    bottom: 8px;
    min-width: 110px;
    max-width: 42vw;
    max-height: 28vh;
    font-size: 11px;
    padding: 6px 8px;
  }

  #projectionPanel {
    left: 8px;
    bottom: 8px;
    width: 150px;
    height: 150px;
  }

  .popover {
    position: fixed !important;
    left: 8px !important;
    right: 8px !important;
    top: auto !important;
    bottom: 8px !important;
    width: auto !important;
    max-width: none !important;
    max-height: 52vh !important;
    overflow-y: auto !important;
    z-index: 20000 !important;
    border-radius: 10px;
  }

  #customDrawer {
    top: 0;
    right: -100vw;
    width: min(92vw, 360px);
    height: 100dvh;
    z-index: 21000;
  }

  #customDrawer.open {
    right: 0;
  }

  #modalBack {
    align-items: flex-end;
    z-index: 22000;
  }

  .modal {
    width: 100vw;
    max-height: 78dvh;
    border-radius: 14px 14px 0 0;
  }

  .modal-body {
    overflow-x: auto;
  }

  .wyckoff-table,
  table {
    min-width: 560px;
  }

  #error {
    top: 10px;
    max-width: calc(100vw - 20px);
    font-size: 12px;
  }

  .modebar {
    transform: scale(.86);
    transform-origin: top right;
  }
}

@media (max-width: 420px) {
  #viewerWrap {
    height: calc(100dvh - 156px);
  }

  #toolbar select,
  #toolbar button {
    max-width: 44vw;
    font-size: 11px;
  }

  #projectionPanel {
    width: 130px;
    height: 130px;
  }

  #infoPanel {
    max-height: 30vh;
  }
}


.mobile-only { display:none; }

@media (max-width:760px) {
  .mobile-only { display:block; }

  #toolbar {
    min-height:54px;
    height:54px;
    flex-wrap:nowrap;
    padding:8px 10px;
    overflow:visible;
  }

  #toolbar > select,
  #toolbar > .control,
  #toolbar > #wyckoffButton,
  #toolbar > #customButton,
  #toolbar > #themeMode,
  #toolbar > .version {
    display:none !important;
  }

  #toolbar .brand {
    width:auto;
    flex:1;
    font-size:14px;
  }

  #mobileMenuButton {
    display:block !important;
    margin-left:auto;
    max-width:none;
  }

  #viewerWrap {
    height:calc(100dvh - 54px);
    min-height:0;
  }

  /* Hide overlays by default on mobile. */
  #infoPanel,
  #elementLegend,
  #projectionPanel {
    display:none;
  }

  #infoPanel.mobile-open,
  #elementLegend.mobile-open,
  #projectionPanel.mobile-open {
    display:block;
  }

  #infoPanel {
    left:8px;
    right:8px;
    top:8px;
    width:auto;
    max-height:55vh;
    overflow:auto;
    z-index:18000;
  }

  #elementLegend {
    right:8px;
    left:auto;
    bottom:8px;
    max-width:55vw;
    max-height:42vh;
    z-index:18000;
  }

  #projectionPanel {
    left:8px;
    bottom:8px;
    width:160px;
    height:160px;
    z-index:18000;
  }

  #mobileMenuDrawer {
    position:fixed;
    inset:54px 0 0 auto;
    width:min(88vw,360px);
    background:var(--panel);
    color:var(--text);
    border-left:1px solid var(--border);
    box-shadow:-8px 0 24px rgba(0,0,0,.18);
    z-index:25000;
    transform:translateX(105%);
    transition:transform .2s ease;
    overflow:auto;
  }

  #mobileMenuDrawer.open {
    transform:translateX(0);
  }

  .mobile-menu-head {
    position:sticky;
    top:0;
    display:flex;
    align-items:center;
    gap:8px;
    padding:12px;
    background:var(--panel);
    border-bottom:1px solid var(--border);
    z-index:2;
  }

  .mobile-menu-head b { flex:1; }

  .mobile-menu-body {
    padding:12px;
  }

  .mobile-section {
    margin-bottom:14px;
  }

  .mobile-section label {
    display:block;
    font-size:12px;
    color:var(--muted);
    margin-bottom:5px;
  }

  .mobile-section select,
  .mobile-section button {
    width:100%;
    max-width:none;
  }

  .mobile-stack {
    display:grid;
    gap:7px;
  }

  /* Generic popovers become bottom sheets. */
  .popover {
    position:fixed !important;
    left:8px !important;
    right:8px !important;
    top:auto !important;
    bottom:8px !important;
    width:auto !important;
    max-width:none !important;
    max-height:62vh !important;
    z-index:26000 !important;
  }

  #customDrawer {
    top:54px;
    width:min(92vw,360px);
    height:calc(100dvh - 54px);
    z-index:27000;
  }

  #modalBack {
    z-index:28000;
  }
}


@media (max-width:760px) {
  html, body {
    width:100%;
    height:100%;
    min-height:100%;
    margin:0;
    padding:0;
    overflow:hidden;
  }

  body {
    position:fixed;
    inset:0;
  }

  #toolbar {
    position:fixed !important;
    top:0;
    left:0;
    right:0;
    width:100%;
    height:54px !important;
    min-height:54px !important;
    max-height:54px !important;
    z-index:30000;
    flex-wrap:nowrap !important;
    overflow:visible !important;
  }

  #viewerWrap {
    position:fixed !important;
    top:54px !important;
    left:0 !important;
    right:0 !important;
    bottom:0 !important;
    width:100vw !important;
    height:auto !important;
    min-height:0 !important;
    margin:0 !important;
    padding:0 !important;
    overflow:hidden !important;
  }

  #plot,
  .plot,
  #viewerWrap > .plot,
  #viewerWrap .js-plotly-plot,
  #viewerWrap .plot-container,
  #viewerWrap .svg-container {
    position:absolute !important;
    inset:0 !important;
    width:100% !important;
    height:100% !important;
    min-width:0 !important;
    min-height:0 !important;
    max-width:none !important;
    max-height:none !important;
  }

  #plot canvas,
  #plot .gl-container,
  #plot .gl-canvas {
    width:100% !important;
    height:100% !important;
  }

  /* Overlays are removed from layout entirely until opened. */
  #infoPanel,
  #elementLegend,
  #projectionPanel {
    position:fixed !important;
    display:none;
    margin:0 !important;
  }

  #infoPanel.mobile-open,
  #elementLegend.mobile-open,
  #projectionPanel.mobile-open {
    display:block;
  }

  #mobileMenuDrawer {
    top:54px !important;
    bottom:0 !important;
    height:auto !important;
  }
}

</style>
</head>
<body>
<div id="toolbar">

<script>
const BASE = (() => {
  const repoBase = "/Research.github.io/";
  if (location.hostname.endsWith("github.io")) return repoBase;
  if (location.pathname.startsWith(repoBase)) return repoBase;
  return "/";
})();
(async function(){
  const VERSION='web v1.0';
  const $=id=>document.getElementById(id);
  const params=new URLSearchParams(location.search);
  const cifParam=params.get('cif');
  const depositionParam=params.get('deposition')||'';
  const datablockParam=params.get('datablock')||'';
  const titleParam=params.get('title')||'CIF Viewer';
  document.title=titleParam+' — CIF Viewer';
  if(!cifParam){showError('Missing ?cif= parameter.');return;}
  function siteURL(path){
    const clean=String(path||'').replace(/^\.?\/+/, '');
    return new URL(BASE+clean, location.origin).href;
  }
  const cifCandidates=[];
  function addCandidate(value){
    if(!value)return;
    let url;
    try{ url=new URL(value, location.href).href; }catch{return;}
    if(!cifCandidates.includes(url))cifCandidates.push(url);
  }
  addCandidate(cifParam);
  if(depositionParam){
    addCandidate(siteURL(`assets/cifs/${encodeURIComponent(depositionParam)}.cif`));
    addCandidate(siteURL(`assets/cifs/${encodeURIComponent(depositionParam)}.CIF`));
  }
  if(datablockParam && !/^surprise/i.test(datablockParam.trim())){
    const db=datablockParam.trim();
    addCandidate(siteURL(`assets/cifs/${encodeURIComponent(db)}.cif`));
    addCandidate(siteURL(`assets/cifs/${encodeURIComponent(db)}.CIF`));
    if(/^data_/i.test(db)){
      const shortDb=db.replace(/^data_/i,'');
      addCandidate(siteURL(`assets/cifs/${encodeURIComponent(shortDb)}.cif`));
      addCandidate(siteURL(`assets/cifs/${encodeURIComponent(shortDb)}.CIF`));
    }
  }

  const COLORS={H:'#eeeeee',C:'#444444',N:'#3455db',O:'#df3434',F:'#64d964',Cl:'#31bd31',Br:'#963c28',I:'#662b96',P:'#ff851e',S:'#e0c02e',B:'#eeb08f',Si:'#d9aa78',Ge:'#789678',Ga:'#bd8c8c',As:'#bd8050',Sb:'#9e63b5',W:'#3c82aa',Mo:'#5096aa',V:'#787896',Nb:'#64aaaa',Ta:'#508296',Na:'#aa5af0',K:'#8c46dc',Rb:'#7034bf',Cs:'#5a28a0',Mg:'#8bd46d',Ca:'#3cc83c',Sr:'#32b432',Ba:'#28a028',La:'#6ec8be',Ce:'#64c8b4',Pr:'#5abeaa',Nd:'#50b4a5',Sm:'#46aaa0',Eu:'#46a0a0',Gd:'#3c969b',Tb:'#3c9196',Dy:'#378c91',Ho:'#32878c',Er:'#328287',Tm:'#2d7d82',Yb:'#2d787d',Lu:'#287378',Th:'#5078be',U:'#466eb4',Np:'#5064af',Pu:'#5a5aaa',Am:'#6450a5',Cm:'#6e46a0',Bk:'#78419b',Cf:'#823c96'};
  const RADII={H:.31,B:.85,C:.76,N:.71,O:.66,F:.57,Na:1.66,Mg:1.41,Al:1.21,Si:1.11,P:1.07,S:1.05,Cl:1.02,K:2.03,Ca:1.76,Sc:1.70,Ti:1.60,V:1.53,Cr:1.39,Mn:1.39,Fe:1.32,Co:1.26,Ni:1.24,Cu:1.32,Zn:1.22,Ga:1.22,Ge:1.20,As:1.19,Se:1.20,Br:1.20,Rb:2.20,Sr:1.95,Y:1.90,Zr:1.75,Nb:1.64,Mo:1.54,Tc:1.47,Ru:1.46,Rh:1.42,Pd:1.39,Ag:1.45,Cd:1.44,In:1.42,Sn:1.39,Sb:1.39,Te:1.38,I:1.39,Cs:2.44,Ba:2.15,La:2.07,Ce:2.04,Pr:2.03,Nd:2.01,Sm:1.98,Eu:1.98,Gd:1.96,Tb:1.94,Dy:1.92,Ho:1.92,Er:1.89,Tm:1.90,Yb:1.87,Lu:1.87,Hf:1.75,Ta:1.70,W:1.62,Re:1.51,Os:1.44,Ir:1.41,Pt:1.36,Au:1.36,Hg:1.32,Pb:1.46,Bi:1.48,Th:2.06,U:1.96,Np:1.90,Pu:1.87,Am:1.80,Cm:1.69,Cf:1.68};
  const METALS=new Set(['Li','Be','Na','Mg','Al','K','Ca','Sc','Ti','V','Cr','Mn','Fe','Co','Ni','Cu','Zn','Ga','Rb','Sr','Y','Zr','Nb','Mo','Tc','Ru','Rh','Pd','Ag','Cd','In','Sn','Cs','Ba','La','Ce','Pr','Nd','Pm','Sm','Eu','Gd','Tb','Dy','Ho','Er','Tm','Yb','Lu','Hf','Ta','W','Re','Os','Ir','Pt','Au','Hg','Tl','Pb','Bi','Fr','Ra','Ac','Th','Pa','U','Np','Pu','Am','Cm','Bk','Cf']);

  $('wyckoffButton').onclick=()=>$('modalBack').classList.add('open');$('modalClose').onclick=()=>$('modalBack').classList.remove('open');$('modalBack').onclick=e=>{if(e.target===$('modalBack'))$('modalBack').classList.remove('open')};$('wyckoffWindow').onclick=()=>{const w=open('','_blank','width=900,height=700');if(w){w.document.write('<html><head><title>Wyckoff sites</title><style>body{font-family:system-ui;padding:20px}table{width:100%;border-collapse:collapse}th,td{padding:7px;border-bottom:1px solid #ddd;text-align:left}</style></head><body><h2>'+esc(titleParam)+'</h2>'+$('wyckoffContent').innerHTML+'</body></html>');w.document.close()}};
  const saved=localStorage.getItem('cifViewerTheme')||'system';$('themeMode').value=saved;$('themeMode').onchange=e=>applyTheme(e.target.value);matchMedia('(prefers-color-scheme:dark)').addEventListener?.('change',()=>{if($('themeMode').value==='system')applyTheme('system')});
  applyTheme(saved);drawProjection('c');

  // ---------------- Mobile compact controls ----------------
  const mobileMenu = document.getElementById('mobileMenuDrawer');
  const mobileMenuButton = document.getElementById('mobileMenuButton');
  const mobileMenuClose = document.getElementById('mobileMenuClose');

  function closeMobileMenu() {
    mobileMenu?.classList.remove('open');
  }

  mobileMenuButton?.addEventListener('click', function() {
    mobileMenu?.classList.add('open');
  });

  mobileMenuClose?.addEventListener('click', closeMobileMenu);

  const mobileViewMode = document.getElementById('mobileViewMode');
  const mobileProjectionMode = document.getElementById('mobileProjectionMode');
  const mobileThemeMode = document.getElementById('mobileThemeMode');

  if (mobileViewMode && document.getElementById('viewMode')) {
    mobileViewMode.value = document.getElementById('viewMode').value;
    mobileViewMode.addEventListener('change', function() {
      const desktop = document.getElementById('viewMode');
      desktop.value = mobileViewMode.value;
      desktop.dispatchEvent(new Event('change', {bubbles:true}));
    });
  }

  if (mobileProjectionMode && document.getElementById('projectionMode')) {
    mobileProjectionMode.value = document.getElementById('projectionMode').value;
    mobileProjectionMode.addEventListener('change', function() {
      const desktop = document.getElementById('projectionMode');
      desktop.value = mobileProjectionMode.value;
      desktop.dispatchEvent(new Event('change', {bubbles:true}));
    });
  }

  if (mobileThemeMode && document.getElementById('themeMode')) {
    mobileThemeMode.value = document.getElementById('themeMode').value;
    mobileThemeMode.addEventListener('change', function() {
      const desktop = document.getElementById('themeMode');
      desktop.value = mobileThemeMode.value;
      desktop.dispatchEvent(new Event('change', {bubbles:true}));
    });
  }

  function openDesktopMenuFromMobile(menuId) {
    closeMobileMenu();
    const menu = document.getElementById(menuId);
    if (!menu) return;
    document.querySelectorAll('.popover.open').forEach(p => p.classList.remove('open'));
    menu.classList.add('open');
  }

  document.getElementById('mobileAtoms')?.addEventListener('click', () => openDesktopMenuFromMobile('atomsMenu'));
  document.getElementById('mobileBonds')?.addEventListener('click', () => openDesktopMenuFromMobile('bondsMenu'));
  document.getElementById('mobileLengths')?.addEventListener('click', () => openDesktopMenuFromMobile('lengthMenu'));
  document.getElementById('mobileRanges')?.addEventListener('click', () => openDesktopMenuFromMobile('rangeMenu'));

  document.getElementById('mobileWyckoff')?.addEventListener('click', function() {
    closeMobileMenu();
    document.getElementById('wyckoffButton')?.click();
  });

  document.getElementById('mobileCustomize')?.addEventListener('click', function() {
    closeMobileMenu();
    document.getElementById('customButton')?.click();
  });

  function toggleMobileOverlay(id) {
    const el = document.getElementById(id);
    if (!el) return;

    ['infoPanel','elementLegend','projectionPanel'].forEach(otherId => {
      if (otherId !== id) document.getElementById(otherId)?.classList.remove('mobile-open');
    });

    el.classList.toggle('mobile-open');
    closeMobileMenu();
  }

  document.getElementById('mobileCrystalInfo')?.addEventListener('click', () => toggleMobileOverlay('infoPanel'));
  document.getElementById('mobileLegend')?.addEventListener('click', () => toggleMobileOverlay('elementLegend'));
  document.getElementById('mobileProjectionPanel')?.addEventListener('click', () => toggleMobileOverlay('projectionPanel'));

  // Projection button only shows/hides the panel; selected axis still comes from projection selector.
  document.getElementById('mobileProjectionMode')?.addEventListener('change', function() {
    const panel = document.getElementById('projectionPanel');
    if (mobileProjectionMode.value === 'none') {
      panel?.classList.remove('mobile-open');
    }
  });

  // Tap outside open overlays to close them.
  document.getElementById('plot')?.addEventListener('click', function() {
    document.getElementById('infoPanel')?.classList.remove('mobile-open');
    document.getElementById('elementLegend')?.classList.remove('mobile-open');
    document.getElementById('projectionPanel')?.classList.remove('mobile-open');
  });


  // Force Plotly to use the real mobile viewport instead of cached desktop dimensions.
  function resizeMobilePlot() {
    if (window.innerWidth > 760) return;

    const wrap = document.getElementById('viewerWrap');
    const plot = document.getElementById('plot');
    if (!wrap || !plot || !window.Plotly) return;

    const availableHeight = Math.max(
      320,
      (window.visualViewport ? window.visualViewport.height : window.innerHeight) - 54
    );

    wrap.style.height = availableHeight + 'px';
    wrap.style.width = (window.visualViewport ? window.visualViewport.width : window.innerWidth) + 'px';

    plot.style.width = '100%';
    plot.style.height = '100%';

    try {
      Plotly.relayout(plot, {
        autosize: true,
        width: null,
        height: null,
        'scene.aspectmode': 'data'
      });
      Plotly.Plots.resize(plot);
    } catch (e) {}
  }

  window.addEventListener('resize', resizeMobilePlot);
  window.addEventListener('orientationchange', function() {
    setTimeout(resizeMobilePlot, 120);
  });

  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', resizeMobilePlot);
  }

  requestAnimationFrame(function() {
    resizeMobilePlot();
    setTimeout(resizeMobilePlot, 120);
    setTimeout(resizeMobilePlot, 500);
  });

})();
</script>
